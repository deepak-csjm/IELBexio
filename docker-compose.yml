# Local development stack: PostgreSQL, Azurite (optional Azure Blob emulator) and the application.
#
#   docker compose up -d db
#   docker compose up --build app
#
# Secrets are supplied through the environment, never baked into the image or committed. Copy
# .env.example to .env and fill it in for live modes; the defaults run entirely on mocks and fixtures.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ielbexio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: an Azure Blob Storage emulator, so the Azure storage path can be exercised locally.
  # The application defaults to local filesystem storage and does not require this.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "10000:10000"
    profiles: ["azure"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      IELBEXIO_ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-ielbexio};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      IELBEXIO_Shopify__FixtureDirectory: "/app/fixtures/shopify"
      IELBEXIO_Amazon__FixtureDirectory: "/app/fixtures/amazon"
      IELBEXIO_BlobStorage__LocalRootPath: "/app/local-blobs"

      # Everything below is optional and empty by default. The POC runs fully on mocks and fixtures.
      IELBEXIO_Bexio__Mode: ${BEXIO_MODE:-Mock}
      IELBEXIO_Bexio__ClientId: ${BEXIO_CLIENT_ID:-}
      IELBEXIO_Bexio__ClientSecret: ${BEXIO_CLIENT_SECRET:-}
      IELBEXIO_Shopify__Mode: ${SHOPIFY_MODE:-Fixture}
      IELBEXIO_Shopify__ShopDomain: ${SHOPIFY_SHOP_DOMAIN:-}
      IELBEXIO_Shopify__AccessToken: ${SHOPIFY_ACCESS_TOKEN:-}
      IELBEXIO_Amazon__Mode: ${AMAZON_MODE:-Fixture}
      IELBEXIO_Ai__Enabled: ${AI_ENABLED:-false}
      IELBEXIO_Ai__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      IELBEXIO_Ai__ApiKey: ${AZURE_OPENAI_API_KEY:-}
      IELBEXIO_Ai__Deployment: ${AZURE_OPENAI_DEPLOYMENT:-}
    volumes:
      - blob-data:/app/local-blobs

volumes:
  db-data:
  blob-data:
